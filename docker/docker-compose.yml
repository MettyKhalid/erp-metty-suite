# =============================================================================
# docker/docker-compose.yml
#
# This file grows across steps:
#   Step 3 (now)  →  postgres + pgadmin only
#   Step 4        →  adds the workspace service
#
# We intentionally start with just the database layer so you can verify
# PostgreSQL is healthy and schemas exist before adding more services.
# =============================================================================

version: "3.9"

# =============================================================================
# NETWORKS
#
# All services that need to talk to each other must be on the same network.
# Docker creates a default network, but defining one explicitly gives us:
#   - A predictable name (erp_network) instead of a generated one
#   - Clear documentation of which services are connected
#   - The ability to add external services later without breaking existing ones
#
# "bridge" is the standard driver for single-host networking.
# Each container on this network can reach others using the SERVICE NAME
# as a hostname — so the API reaches postgres at host "postgres", port 5432.
# =============================================================================
networks:
  erp_network:
    driver: bridge

# =============================================================================
# VOLUMES
#
# Named volumes are managed entirely by Docker. On macOS with Docker Desktop
# they live inside the Docker VM's virtual disk — pure Linux I/O, no macOS
# filesystem overhead.
#
# Key property: named volumes PERSIST between "docker compose down" and
# "docker compose up". Your database data survives container restarts.
#
# To completely wipe the database and start fresh:
#   docker compose down -v       (-v removes volumes too)
# =============================================================================
volumes:
  postgres_data:
    # Stores PostgreSQL's actual data files: tables, indexes, WAL logs.
    # Losing this volume = losing all data. Back it up before "down -v".

  pgadmin_data:
    # Stores pgAdmin's user preferences, saved queries, and session data.
    # Less critical — losing it just means you reconfigure the UI.

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    # WHY 16-alpine?
    #   "16"      → pin the major version; never use "latest" (silent upgrades
    #               can break schema compatibility between major PG versions)
    #   "alpine"  → Debian-based image is ~400 MB; Alpine variant is ~80 MB.
    #               For PostgreSQL specifically, Alpine is safe — the postgres
    #               binary doesn't use musl-incompatible native npm packages
    #               the way Node.js does.

    container_name: erp_postgres
    # A fixed name lets you run "docker logs erp_postgres" without looking
    # up the generated container ID.

    restart: unless-stopped
    # Restart policy options:
    #   "no"             → never restart automatically (default)
    #   "always"         → restart even after manual stop (annoying in dev)
    #   "unless-stopped" → restart on crash or daemon restart, but NOT after
    #                      "docker stop" — the best balance for development

    networks:
      - erp_network

    environment:
      # These env vars are read by the postgres image entrypoint on first boot.
      # They create the database, user, and password.
      POSTGRES_DB: erp_db # The database to create
      POSTGRES_USER: erp_user # The superuser for this database
      POSTGRES_PASSWORD: erp_password # Their password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
      # WHY force UTF-8?
      #   The default locale depends on the base image and can vary.
      #   Explicitly setting UTF-8 ensures correct storage of international
      #   characters (Arabic, accented Latin, etc.) regardless of environment.

    ports:
      - "5432:5432"
      # FORMAT: "host_port:container_port"
      #
      # This publishes port 5432 from inside the container to port 5432
      # on your Mac (via Docker Desktop's port forwarding).
      #
      # Two use cases:
      #   1. Your Mac tools (TablePlus, Postico, DBeaver) connect to localhost:5432
      #   2. The DevContainer's SQLTools extension connects to localhost:5432
      #
      # Services inside the Docker network use "postgres:5432" (service name),
      # NOT "localhost:5432" — that distinction is important and a common source
      # of confusion when writing DATABASE_URL environment variables.

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mounts the named volume at the path where postgres stores all its data.
      # Without this, every "docker compose down" wipes the database.

      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Bind-mount: maps our local init.sql into the special directory the
      # postgres image scans on first boot.
      #
      # "01-" prefix: files in initdb.d are executed in alphabetical order.
      #   If you add more init files later (02-roles.sql, 03-seed.sql...),
      #   the prefix controls execution order.
      #
      # ":ro" (read-only): the container can read the file but not modify it.
      #   Best practice for any config file bind-mounted into a container.
      #
      # The path is relative to THIS docker-compose.yml file (docker/).

    healthcheck:
      # Docker uses this to determine when postgres is truly ready to accept
      # connections (not just running). Other services use:
      #   depends_on:
      #     postgres:
      #       condition: service_healthy
      # to wait for this check to pass before starting.
      #
      # Without healthcheck + depends_on, pgAdmin might try to connect to
      # postgres before it's finished initializing and fail.
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 10s # Check every 10 seconds
      timeout: 5s # Consider failed if no response within 5 seconds
      retries: 5 # Mark unhealthy after 5 consecutive failures
      start_period: 20s
      # start_period: grace period before checks begin.
      # On first boot, postgres runs init.sql (creating extensions, schemas,
      # functions) which takes a few seconds. Without this grace period, the
      # healthcheck might fail before init is complete and mark the container
      # unhealthy prematurely.

  # ---------------------------------------------------------------------------
  # pgAdmin 4
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    # pgAdmin doesn't have the same major-version compatibility concerns as
    # PostgreSQL, so "latest" is acceptable here. Pin to a specific version
    # (e.g. dpage/pgadmin4:8.4) if you want fully reproducible builds.

    container_name: erp_pgadmin

    restart: unless-stopped

    networks:
      - erp_network

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@erp.local
      PGADMIN_DEFAULT_PASSWORD: admin
      # These are the credentials you use to log in to the pgAdmin web UI.
      # They are not related to the PostgreSQL user — pgAdmin is a separate app.

      PGADMIN_CONFIG_SERVER_MODE: "False"
      # Server mode = False means single-user desktop mode.
      # In server mode, pgAdmin shows a login screen and manages multiple users.
      # For local development, this is unnecessary friction — disable it.

      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # The master password encrypts saved server passwords in pgAdmin.
      # Disable for local dev — you'd need to enter it every time you rebuild.

    ports:
      - "5050:80"
      # pgAdmin's web server runs on port 80 inside the container.
      # We map it to port 5050 on your Mac.
      # Open http://localhost:5050 in your browser after "docker compose up".

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Persists pgAdmin settings, saved queries, and UI preferences.

      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Pre-loads our ERP Local server definition.
      # Without this, every time you rebuild the container you would need to
      # manually add the postgres connection in the pgAdmin UI.
      #
      # The server appears automatically but pgAdmin will still ask for the
      # password on first connection — enter: erp_password

    depends_on:
      postgres:
        condition: service_healthy
      # pgAdmin only starts after the postgres healthcheck passes.
      # This prevents the "connection refused" error you'd see if pgAdmin
      # tried to connect during postgres's initialization phase.
