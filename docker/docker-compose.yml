# =============================================================================
# docker/docker-compose.yml
#
# Step 4: full stack — postgres + pgadmin + workspace
#
# What changed from Step 3:
#   • Added "workspace" service (the Node.js dev container)
#   • Added two named volumes for node_modules (performance on macOS)
#   • DATABASE_URL environment variable wires workspace → postgres
# =============================================================================

networks:
  erp_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:

  # ── NEW in Step 4 ──────────────────────────────────────────────────────────
  # Named volumes for node_modules.
  #
  # WHY not just let node_modules live in the bind-mount?
  #
  # On macOS, Docker Desktop routes bind-mounts through a translation layer
  # between the macOS filesystem and the Docker Linux VM. This is fast enough
  # for source files (you edit a .ts file, the change is visible immediately),
  # but node_modules contains tens of thousands of tiny files. Every npm install
  # would write all of them through that translation layer — extremely slow.
  #
  # Named volumes live entirely inside the Docker VM's virtual disk. There is
  # no macOS <-> Linux translation — it is native Linux I/O. npm install runs
  # at full speed.
  #
  # HOW it works with bind-mounts:
  # The project root is bind-mounted to /workspace (delegated mode).
  # That would normally include /workspace/api/node_modules.
  # By declaring a named volume at that exact sub-path, Docker "shadows"
  # the bind-mount at that directory — the volume takes priority.
  # Your Mac never sees node_modules; the container reads/writes it natively.
  workspace_api_modules:
  workspace_frontend_modules:

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — unchanged from Step 3
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    networks:
      - erp_network
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # pgAdmin 4 — unchanged from Step 3 (with email fix)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erp_pgadmin
    restart: unless-stopped
    networks:
      - erp_network
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@erp.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Workspace — NEW in Step 4
  #
  # This is the Node.js container where both the HapiJS API and Angular
  # frontend will run during development.
  # ---------------------------------------------------------------------------
  workspace:
    build:
      context: ..
      # "context" is the directory Docker packages and sends to the daemon.
      # ".." means the project root (one level up from docker/).
      # This is necessary because the Dockerfile copies nothing from disk —
      # but Docker still needs a build context to execute the build in.
      # The .dockerignore file in docker/workspace/ controls what gets sent.

      dockerfile: docker/workspace/Dockerfile
      # Path to the Dockerfile, relative to the context (project root).

    container_name: erp_workspace
    restart: unless-stopped
    networks:
      - erp_network

    environment:
      NODE_ENV: development

      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/erp_db
      # -----------------------------------------------------------------------
      # This is the most important environment variable in the project.
      # It tells Prisma (and any raw pg client) how to connect to the database.
      #
      # Anatomy of the URL:
      #   postgresql://       protocol (also valid: postgres://)
      #   erp_user            database user
      #   :erp_password       their password
      #   @postgres           HOST — the Docker SERVICE NAME, not "localhost".
      #                       "postgres" resolves to the postgres container IP
      #                       on erp_network via Docker's built-in DNS.
      #   :5432               port (PostgreSQL default)
      #   /erp_db             database name
      #
      # Common mistake: using @localhost:5432 here.
      # "localhost" inside a container means the container itself — not the
      # postgres container. That gives you "connection refused" every time.
      # -----------------------------------------------------------------------

    ports:
      - "3000:3000" # HapiJS API  -> http://localhost:3000
      - "4200:4200" # Angular     -> http://localhost:4200

    volumes:
      - ..:/workspace:delegated
      # Bind-mount the entire project root into /workspace inside the container.
      #
      # ":delegated" consistency mode:
      #   On macOS, container writes (compiled files, generated code) are
      #   buffered before being synced back to the macOS filesystem.
      #   This prioritises container write speed — important for Angular's
      #   incremental build cache and TypeScript compilation output.
      #   For source files you edit on the Mac side, changes are visible
      #   inside the container almost immediately.
      #
      # The path ".." is relative to docker-compose.yml (inside docker/).
      # So ".." resolves to the project root — erp-suite/.

      - workspace_api_modules:/workspace/api/node_modules
      # This named volume "shadows" api/node_modules from the bind-mount above.
      # Result: npm install for the API runs at native Linux speed.

      - workspace_frontend_modules:/workspace/frontend/node_modules
      # Same for the Angular frontend's node_modules.

    depends_on:
      postgres:
        condition: service_healthy
      # The workspace container starts only after postgres passes its
      # healthcheck. This prevents Prisma from trying to connect to a
      # database that is not ready yet when we run migrations on startup.

    # Keeps the container alive so you can open a terminal inside it.
    # In Step 5, devcontainer.json overrides this with "sleep infinity"
    # for VS Code attachment. Both achieve the same thing — a process
    # that never exits so the container stays running.
    command: tail -f /dev/null
